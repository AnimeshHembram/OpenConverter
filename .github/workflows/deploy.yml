# CI for every push and pull request; deploys to GitHub Pages only from main.
#
# Pull requests: run the full test suite, never deploy.
# Push to main (or a manual run on main): run the same tests, then deploy
# exactly the dist-pages/ build that the subpath browser tests just checked.
#
# Required once in the repository: Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions". No secrets are needed.
name: CI and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the deploy job gets more.
permissions:
  contents: read

# Pull requests: one run per PR; a newer push cancels the older run.
# main and manual runs: queued, never cancelled. They use a different group
# from pull requests, so a PR run can never cancel a production deployment.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      # GitHub Pages project sites live at /<repository-name>/.
      PAGES_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Clean install from the lockfile
        run: npm ci

      - name: Install browsers (Chromium, Firefox, WebKit) and OS dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build at "/" (for the root browser suite)
        run: npm run build

      - name: Browser tests against the root build (all projects)
        run: npm run test:e2e

      - name: Production build for GitHub Pages (repository subpath)
        run: npm run build:pages
        env:
          BASE_PATH: ${{ env.PAGES_BASE_PATH }}

      - name: Browser tests against the Pages build, served at its subpath
        run: npm run test:e2e:pages
        env:
          BASE_PATH: ${{ env.PAGES_BASE_PATH }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-reports
          path: |
            playwright-report/
            playwright-report-pages/
            test-results/
          retention-days: 7

      - name: Upload the tested Pages build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deployments never cancel each other; a newer one waits its turn.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
